x-env: &env
  GAMEDIR: id1
  # Public port served by nginx (mapped via `ports:` below).
  # Note: nginx listens on 26000 inside the container.
  SERVER_PORT: "26000"

x-defaults: &defaults
  image: fteqw-webquake
  build:
    context: .
    network: host
  environment: *env
  restart: unless-stopped
  volumes:
    - ./gamedata:/gamedata:ro
services:
  fteqw:
    <<: *defaults
    # Default mode is `all`, which runs both:
    # - nginx (serves the WASM client)
    # - fteqw-sv (NetQuake) on 127.0.0.1, reverse-proxied at /nq
    command: ["all"]
    ports:
      - 26000:26000
