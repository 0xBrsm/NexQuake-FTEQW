x-env: &env
  GAMEDIR: id1
  SERVER_PORT: "27500"

x-defaults: &defaults
  image: fteqw-webquake
  build:
    context: .
    network: host
  environment: *env
  restart: unless-stopped
  volumes:
    - ./gamedata:/gamedata:ro
  networks:
    - q1
services:
  server:
    <<: *defaults
    command: ["server"]
    ports:
    - 27500:27500
  client:
    <<: *defaults
    command: ["client"]
    environment:
      <<: *env
      # Backend endpoint that returns a text server list for FTE's HTTP master poller.
      # Each line should start with a server address (e.g. ws://host:27500/) and may include an infostring.
      # CORS is required if this URL is cross-origin.
      # Example:
      # MASTER_HTTP_URL: "https://example.com/nq/servers.txt"
      MASTER_HTTP_URL: ""
    ports:
    - 8080:8080
networks:
  q1:
