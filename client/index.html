<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexQuake-FTE</title>
    <style>
      html, body { background:#000; color:#aaa; height:100%; width:100%; margin:0; }
      #status {
        position:fixed; left:0; top:0; right:0; padding:8px 12px;
        font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px;
        background:rgba(0,0,0,0.75); z-index:2;
      }
      canvas { display:block; width:100%; height:100%; }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <!-- Generated at container start when WebTransport is enabled: sets
         window.NQWT_HASHES to the SHA-256(s) of the server's self-signed cert so
         the WT client can pin it. Absent/empty in plain-HTTP (WebSocket) mode. -->
    <script src="/wtconfig.js"></script>
    <!-- Generated at container start: window.NQ_GAMEDIR = the deployment's game
         (id1 | baseq2 | baseq3), so the client launches the matching game. -->
    <script src="/gameconfig.js"></script>
    <script>
      // Boot the FTE client and auto-connect to the dedicated server through the
      // Nexus trunk relay. Gameplay rides the 2-byte-port-prefixed trunk framing
      // in the engine's NP_TRUNK driver: WebTransport (unreliable QUIC datagrams)
      // when the page is HTTPS and the browser supports it, else WebSocket.
      // Append ?transport=ws to force the WebSocket fallback.
      (function () {
        var host = window.location.host;
        var connectUrl = "trunk://" + host + "/connect";
        var gamedir = window.NQ_GAMEDIR || "id1";

        // Lock the in-game server browser to Nexus-managed games only: inject a
        // masters.txt so FTE queries our HTTP server list (masterhttp) instead of
        // the public FTE master servers. Each listed server connects over trunk.
        var serversUrl = window.location.origin + "/servers.txt";
        var mastersTxt = serversUrl + " masterhttp:nq Servers\n";

        // Transport selection, mirroring NexQuake's Module.nqTransportConfig: a
        // WebTransport url (same origin /connect) when HTTPS + WebTransport are
        // available and not overridden, with the self-signed cert pinned by hash.
        var forceWS = /(?:^|[?&])transport=ws(?:&|$)/.test(window.location.search);
        var transportConfig = {};
        if (!forceWS && window.location.protocol === "https:" && typeof WebTransport === "function") {
          transportConfig.webtransport = { url: "https://" + host + "/connect" };
          if (window.NQWT_HASHES && window.NQWT_HASHES.length)
            transportConfig.webtransport.serverCertificateHashes = window.NQWT_HASHES;
        }

        window.Module = {
          nqTransportConfig: transportConfig,
          autostart: true,
          canvas: document.getElementById("canvas"),
          arguments: [
            "-manifest", "/index.fmf",
            "-game", gamedir,
            "+set", "cl_web_connect_host", host,
            "+connect", connectUrl
          ],
          files: {
            "masters.txt": new TextEncoder().encode(mastersTxt).buffer
          },
          print: function (m) { console.log(m); },
          printErr: function (m) { console.error(m); },
          setStatus: function (t) {
            var e = document.getElementById("status");
            if (e) e.textContent = t || "";
          }
        };
        var s = document.createElement("script");
        s.src = "ftewebgl.js";
        s.async = true;
        s.addEventListener("error", function () {
          document.getElementById("status").textContent = "Failed to load ftewebgl.js";
        });
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
