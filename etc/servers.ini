# Nexus launch plan (one line per dedicated server instance).
# Trunk delivers ordinary UDP to fteqw-sv, so the server is a plain UDP Quake
# server on port 26000 -- no sv_port_tcp / websockets needed. The 2-byte port
# prefix in the FTE client's NP_TRUNK driver targets this port.
fteqw-sv -dedicated -basedir /app/client/gamedata -game id1 +set sv_port 27500 +set sv_public 0 +set hostname "NexQuake-FTE" +map start
