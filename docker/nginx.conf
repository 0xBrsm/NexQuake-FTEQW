worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_x_forwarded_proto $ws_scheme {
    default ws;
    https   wss;
  }

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  gzip_static on;

  server {
    listen 26000;
    server_name _;

    root /opt/fteqw/web;
    index index.html;

    location = / {
      try_files /index.html =404;
    }

    location / {
      try_files $uri =404;
    }

    # Dynamic server list for the in-game server browser.
    # FTE's HTTP poller expects a plaintext list: one server per line.
    # We return a single server entry pointing back to this same container, via the websocket proxy path.
    location = /servers.txt {
      default_type text/plain;
      add_header Cache-Control "no-store";
      # In WEBCLIENT builds, websocket servers can't be pinged via UDP.
      # Include an infostring so the browser can still list the server as alive.
      return 200 "$ws_scheme://$http_host/nq/ \\hostname\\NetQuake\\modname\\id1\\mapname\\dm4\\clients\\0\\maxclients\\16\\timelimit\\30\\fraglimit\\40\\\n";
    }

    # WebSocket proxy to the internal NetQuake server.
    location /nq {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;

      proxy_pass http://127.0.0.1:27500;
    }

    location /gamedata/ {
      alias /gamedata/;
      autoindex on;
    }
  }
}
