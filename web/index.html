<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fteqw-WebQuake</title>
    <style>
      html,
      body {
        background: #000;
        color: #aaa;
        height: 100%;
        width: 100%;
        margin: 0;
      }
      #status {
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        padding: 8px 12px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.75);
        z-index: 2;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script src="/config.js"></script>
    <script>
      (function () {
        function buildConnectUrl(cfg) {
          if (cfg && cfg.connectOverride) return cfg.connectOverride;
          const host = (cfg && cfg.serverHost) || window.location.hostname;
          const port = (cfg && cfg.serverPort) || "27500";
          const schemePref = (cfg && cfg.wsScheme) || "auto";
          const scheme =
            schemePref === "ws" || schemePref === "wss"
              ? schemePref
              : window.location.protocol === "https:"
                ? "wss"
                : "ws";
          return `${scheme}://${host}:${port}/`;
        }

        const cfg = window.FTEQW_WEBQUAKE || {};
        const connectUrl = buildConnectUrl(cfg);
        const manifestUrl = cfg.manifestUrl || "/index.fmf";

        window.Module = {
          autostart: true,
          canvas: document.getElementById("canvas"),
          arguments: ["+connect", connectUrl, "-manifest", manifestUrl],
          print: function (msg) {
            console.log(msg);
          },
          printErr: function (msg) {
            console.error(msg);
          },
          setStatus: function (text) {
            const el = document.getElementById("status");
            el.textContent = text || "";
          },
        };

        const s = document.createElement("script");
        s.src = "ftewebgl.js";
        s.async = true;
        s.addEventListener("error", function () {
          document.getElementById("status").textContent =
            "Failed to load ftewebgl.js";
        });
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
